services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-password}
      MYSQL_DATABASE: ecobin
      MYSQL_USER: ecobin
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-db-password}
    volumes:
      - ecobin_mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./lookups.sql:/docker-entrypoint-initdb.d/02-lookups.sql:ro
      - ./views.sql:/docker-entrypoint-initdb.d/03-views.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uecobin", "-p${MYSQL_PASSWORD:-change-db-password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ../backend/backend.env
    environment:
      APP_ENV: production
      SEED_DEMO: "false"
      WASTE_AUTO_APPROVE: "false"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      API_ADDR: ":8080"
      MYSQL_DSN: ecobin:${MYSQL_PASSWORD:-change-db-password}@tcp(mysql:3306)/ecobin?parseTime=true&charset=utf8mb4&loc=Local
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ecobin_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_DEMO_LOGIN: "false"
    restart: unless-stopped
    environment:
      PORT: 3000
    depends_on:
      - backend

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  ecobin_mysql_data:
  ecobin_uploads:
